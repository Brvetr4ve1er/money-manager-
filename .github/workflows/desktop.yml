name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: desktop:build
          - os: windows-latest
            script: desktop:build:win
          - os: macos-latest
            script: desktop:build:mac
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: never look for a signing identity / certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build desktop app
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb
          npm run desktop:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
